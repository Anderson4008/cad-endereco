<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Endereço</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <form method="get" action=".">

        <div class="container mt-5">

            <h1 class="mb-5">Cadastro de Endereço</h1>

            <!-- CEP -->
            <div class="form-group col-md-3">
                <label for="cep">CEP</label>

                <input type="text" class="form-control" id="cep" maxlength="8" placeholder="Digite o CEP">
            </div>

            <br><br>

            <!-- Rua / Número / Bairro -->
            <div class="row">

                <div class="form-group col-md-4">
                    <label for="rua">Rua</label>

                    <input type="text" class="form-control" id="rua" placeholder="Rua dos Bobos">
                </div>

                <div class="form-group col-md-2">
                    <label for="numero">N.º</label>

                    <input type="text" class="form-control" id="numero" placeholder="Nº 0">
                </div>

                <div class="form-group col-md-4">
                    <label for="bairro">Bairro</label>

                    <input type="text" class="form-control" id="bairro" placeholder="Digite o bairro">
                </div>

            </div>

            <br><br>

            <!-- Complemento / Cidade / Estado -->
            <div class="row">

                <div class="form-group col-md-3">
                    <label for="complemento">Complemento</label>

                    <input type="text" class="form-control" id="complemento" placeholder="Apartamento, casa, etc">
                </div>

                <div class="form-group col-md-4">
                    <label for="cidade">Cidade</label>

                    <input type="text" class="form-control" id="cidade">
                </div>

                <div class="form-group col-md-3">
                    <label for="estado">Estado</label>

                    <input type="text" class="form-control" id="estado">
                </div>

            </div>

            <br><br>

            <!-- Botão -->
            <button type="submit" class="btn btn-primary">

                Entrar

            </button>

        </div>

    </form>

    <!-- JavaScript -->
    <script src="./controller.js"></script>

</body>

</html>
